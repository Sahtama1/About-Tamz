<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamzyp Introduction</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

/* Background particle */
body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
animation:moveBg 40s linear infinite;
opacity:0.15;
}

@keyframes moveBg{
0%{transform:translate(0,0)}
100%{transform:translate(-200px,-200px)}
}

.container{
text-align:center;
z-index:2;
}

/* Nama */
.name{
font-size:70px;
font-weight:bold;
letter-spacing:5px;
background:linear-gradient(90deg,#00f2ff,#00ff9d,#00f2ff);
-webkit-background-clip:text;
color:transparent;
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 10px #00f2ff,
0 0 20px #00f2ff,
0 0 40px #00ff9d;
}
to{
text-shadow:0 0 20px #00f2ff,
0 0 40px #00f2ff,
0 0 80px #00ff9d;
}
}

/* garis neon */
.line{
width:200px;
height:3px;
margin:20px auto;
background:linear-gradient(90deg,transparent,#00f2ff,transparent);
animation:lineMove 3s infinite;
}

@keyframes lineMove{
0%{width:0}
50%{width:200px}
100%{width:0}
}

/* deskripsi */
.desc{
font-size:18px;
opacity:0.8;
margin-top:10px;
animation:fadeIn 3s ease;
}

@keyframes fadeIn{
0%{opacity:0; transform:translateY(20px)}
100%{opacity:0.8; transform:translateY(0)}
}

/* tombol */
.btn{
margin-top:30px;
padding:12px 30px;
border:2px solid #00f2ff;
background:transparent;
color:white;
font-size:16px;
border-radius:30px;
cursor:pointer;
transition:0.4s;
}

.btn:hover{
background:#00f2ff;
color:black;
box-shadow:0 0 20px #00f2ff;
transform:scale(1.1);
}

</style>
</head>

<body>

<div class="container">

<h1 class="name">Tamzyp</h1>

<div class="line"></div>

<p class="desc">
Welcome to my introduction page.  
Creative • Developer • Digital Explorer
</p>

<button class="btn">Explore</button>

</div>

</body>
</html>
